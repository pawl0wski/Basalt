<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYP – informational toasts Q1/Q3/Q6 (do wyrzucenia)</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,sans-serif;background:#1b1d21;color:#e6e6e6}
.proto{background:#7a5b00;color:#fff;padding:4px 12px;font-size:12px}
header{padding:12px 16px;border-bottom:1px solid #333}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab,.btn,.seg button{background:#2b2e34;color:#e6e6e6;border:1px solid #444;border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit}
.tab.on,.seg button.on{background:#3b6fd4;border-color:#3b6fd4}
.btn:hover,.tab:hover{border-color:#888}
.btn.danger{border-color:#a44}
.question{padding:12px 16px;background:#23262b;border-bottom:1px solid #333}
.question b{color:#8fb4ff}
.seg{display:inline-flex;gap:0;margin:6px 0}
.seg button{border-radius:0}
.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}
.desc{color:#aab;font-size:13px;margin:4px 0}
.stage{display:grid;grid-template-columns:260px 1fr;min-height:420px;position:relative;margin:16px;border:1px solid #444;border-radius:8px;overflow:hidden;background:#15171a}
.side{border-right:1px solid #333;padding:10px;display:flex;flex-direction:column;gap:6px;background:#1a1c20}
.main{padding:14px;position:relative}
.row{padding:4px 8px;border-radius:4px;display:flex;justify-content:space-between;align-items:center}
.row:hover{background:#262a30}
.row small{color:#889}
.row .act{display:none;gap:4px}.row:hover .act{display:flex}
.row .act button{font-size:11px;padding:1px 6px;background:#333;border:1px solid #555;color:#ddd;border-radius:4px;cursor:pointer}
.alert{border:1px solid #c9a227;background:#3a3216;color:#f5e3a0;padding:8px 10px;border-radius:6px;font-size:13px;display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.alert.err{border-color:#c0504d;background:#3a1b1b;color:#f4b6b4}
.alert button{background:none;border:0;color:inherit;cursor:pointer;font-size:16px;line-height:1}
.muted{color:#778;font-size:12px}
.stale{font-size:11px;color:#e8a;margin-top:2px}
.modal-bg{position:absolute;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:5}
.modal{background:#262a30;border:1px solid #555;border-radius:8px;padding:16px;width:340px}
.modal input,.main input.t,.main textarea{width:100%;background:#15171a;color:#eee;border:1px solid #555;border-radius:6px;padding:6px 8px;font:inherit}
.modal input.bad{border-color:#c0504d}
.field-err{color:#f4a09d;font-size:12px;margin-top:4px}
.modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.h1in{font-size:22px;font-weight:700}
.toasts{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;width:310px;z-index:10}
.toast{background:#2f3540;border:1px solid #556;border-radius:8px;padding:8px 10px;display:flex;gap:8px;justify-content:space-between;box-shadow:0 4px 14px #0008;position:relative;overflow:hidden}
.toast button{background:none;border:0;color:#ccc;cursor:pointer;font-size:16px}
.toast .bar{position:absolute;left:0;bottom:0;height:3px;background:#3b6fd4;width:100%;transform-origin:left;animation:shrink 5s linear forwards}
.toast.paused .bar{animation-play-state:paused}
@keyframes shrink{to{transform:scaleX(0)}}
.verdict{margin:0 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.verdict div{background:#23262b;border:1px solid #333;border-radius:8px;padding:10px;font-size:13px}
.verdict h4{margin:0 0 4px}
.verdict .on{border-color:#3b6fd4}
.log{margin:0 16px 16px;font-size:12px;color:#99a;font-family:ui-monospace,monospace}
</style>
</head>
<body>
<div class="proto">PROTOTYP – kod do wyrzucenia. Odpowiada na pytania Q1, Q3, Q6 ze specyfikacji informational-toasts. Stan tylko w pamięci.</div>
<header>
  <div class="tabs">
    <button class="tab" data-q="q1">Q1 · częściowe niepowodzenia</button>
    <button class="tab" data-q="q3">Q3 · kolizja w dialogu rename</button>
    <button class="tab" data-q="q6">Q6 · błąd tytułu (S06)</button>
  </div>
</header>
<div class="question" id="question"></div>
<div class="stage" id="stage"></div>
<div class="verdict" id="verdict"></div>
<div class="log" id="log"></div>

<script>
const S = {
  q: 'q1', variant: {q1:'A', q3:'A', q6:'A'},
  toasts: [], tid: 0,
  q1: {notes:['Alfa.md','Beta.md','Gamma.md','Delta.md'], dest:[], trash:[], alert:null},
  q3: {open:false, name:'Testowa.md', err:null, notes:['Testowa.md','Inna.md']},
  q6: {title:'Moja notatka', alert:null, body:'Zacznij pisać tutaj…'},
  log: []
};
const log = m => { S.log.unshift(m); S.log = S.log.slice(0,6); };
const $ = s => document.querySelector(s);

const QS = {
  q1: {
    title: 'Q1 – Czy częściowe niepowodzenia (przeniesienie / usunięcie) mają być toastem?',
    desc: 'Nic nie ginie, drzewo pokazuje wynik. Ryzyko: toast zniknie po 5 s, zanim właściciel go zauważy.',
    A: 'A (spec): toast, znika sam po 5 s',
    B: 'B: trwały Alert w sidebarze do następnej udanej operacji',
    vA: ['Plus: sidebar nie zostaje z nieaktualnym komunikatem (dokładnie problem z #33).','Minus: łatwo przeoczyć, że 1 notatka się nie przeniosła.'],
    vB: ['Plus: komunikat nie zniknie niezauważony.','Minus: to jest właśnie stary, „zalegający” komunikat, który właściciel zgłosił.']
  },
  q3: {
    title: 'Q3 – Kolizja nazwy przy rename, gdy dialog jest otwarty',
    desc: 'Wpisz nazwę, która już istnieje (Inna.md) i zatwierdź. Dla porównania: przycisk „kolizja bez dialogu” pokazuje przypadek, gdzie toast jest w obu wariantach.',
    A: 'A (spec): błąd inline w dialogu, dialog zostaje otwarty, bez toasta',
    B: 'B (jak w issue): dialog się zamyka i pojawia się toast',
    vA: ['Plus: właściciel poprawia nazwę w miejscu, nic nie traci.','Minus: odbiega od literalnego zapisu issue („toast”).'],
    vB: ['Plus: zgodne z literą issue, jedna reguła „kolizja = toast”.','Minus: wpisana nazwa przepada, trzeba otworzyć rename od nowa.']
  },
  q6: {
    title: 'Q6 – Błąd tytułu z pierwszego nagłówka (S06): toast czy alert nad edytorem?',
    desc: 'Zmień nagłówek na „Inna” (istniejąca nazwa) i opuść pole (lub kliknij Zatwierdź). Plik zachowuje starą nazwę i tekst. Potem pisz dalej w treści.',
    A: 'A (spec): toast, znika sam',
    B: 'B (plan S06): zamykany alert nad edytorem, zostaje',
    vA: ['Plus: brak drugiej, zalegającej powierzchni; spójne z kolizją przy przenoszeniu.','Minus: po 5 s nie widać już, czemu nazwa pliku się nie zmieniła.'],
    vB: ['Plus: informacja jest przy edytorze, dopóki ją zamkniesz.','Minus: zostaje po poprawieniu tytułu, jeśli nie zamkniesz ręcznie (to samo „stale”).']
  }
};

function toast(text){
  const id = ++S.tid;
  S.toasts.push({id,text,timer:null,left:5000,t0:Date.now()});
  if(S.toasts.length>3) { const d=S.toasts.shift(); clearTimeout(d.timer); log('stos pełny – zniknął najstarszy toast'); }
  start(S.toasts.find(x=>x.id===id));
  log('toast: '+text);
  renderToasts();
}
function start(t){ t.t0=Date.now(); t.timer=setTimeout(()=>dismiss(t.id),t.left); }
function dismiss(id){ const t=S.toasts.find(x=>x.id===id); if(t) clearTimeout(t.timer); S.toasts=S.toasts.filter(x=>x.id!==id); renderToasts(); }
function pause(id){ const t=S.toasts.find(x=>x.id===id); if(!t||!t.timer) return; clearTimeout(t.timer); t.timer=null; t.left-=Date.now()-t.t0; }
function resume(id){ const t=S.toasts.find(x=>x.id===id); if(!t||t.timer) return; start(t); }

function renderToasts(){
  let box = $('#toasts'); if(!box) return;
  const existing = new Map([...box.children].map(c=>[+c.dataset.id,c]));
  S.toasts.forEach(t=>{
    if(!existing.has(t.id)){
      const el=document.createElement('div'); el.className='toast'; el.dataset.id=t.id; el.setAttribute('role','status');
      el.innerHTML=`<span>${t.text}</span><button aria-label="Zamknij">×</button><div class="bar"></div>`;
      el.querySelector('button').onclick=()=>dismiss(t.id);
      el.onmouseenter=()=>{pause(t.id);el.classList.add('paused')};
      el.onmouseleave=()=>{resume(t.id);el.classList.remove('paused')};
      box.appendChild(el);
    }
  });
  existing.forEach((el,id)=>{ if(!S.toasts.some(t=>t.id===id)) el.remove(); });
}

function seg(q){
  const v=S.variant[q];
  return `<div class="seg"><button data-v="A" class="${v==='A'?'on':''}">${QS[q].A}</button><button data-v="B" class="${v==='B'?'on':''}">${QS[q].B}</button></div>`;
}

function renderQuestion(){
  const q=S.q;
  $('#question').innerHTML=`<b>${QS[q].title}</b><div class="desc">${QS[q].desc}</div>${seg(q)}`;
  $('#question').querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{S.variant[q]=b.dataset.v;resetQ(q);render();});
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.q===q));
  $('#verdict').innerHTML=['A','B'].map(k=>`<div class="${S.variant[q]===k?'on':''}"><h4>Wariant ${k}</h4>${QS[q]['v'+k].map(x=>'<div>'+x+'</div>').join('')}</div>`).join('');
  $('#log').innerHTML='Log: '+(S.log.join(' · ')||'—');
}

function resetQ(q){
  if(q==='q1') S.q1={notes:['Alfa.md','Beta.md','Gamma.md','Delta.md'],dest:[],trash:[],alert:null};
  if(q==='q3') S.q3={open:false,name:'Testowa.md',err:null,notes:['Testowa.md','Inna.md']};
  if(q==='q6') S.q6={title:'Moja notatka',alert:null,body:'Zacznij pisać tutaj…'};
  S.toasts.forEach(t=>clearTimeout(t.timer)); S.toasts=[]; S.log=[];
}

function report(kind,text){
  if(S.variant.q1==='A') toast(text);
  else { S.q1.alert=text; log('trwały Alert w sidebarze'); }
}

function stage(){
  const st=$('#stage'); const q=S.q;
  if(q==='q1'){
    const d=S.q1;
    st.innerHTML=`<div class="side">
      <b>Notatki</b>
      ${d.notes.map(n=>`<div class="row">${n}</div>`).join('')||'<div class="muted">pusto</div>'}
      <b>📁 Archiwum</b>
      ${d.dest.map(n=>`<div class="row">${n}</div>`).join('')||'<div class="muted">pusto</div>'}
      <b>🗑 Kosz</b>
      ${d.trash.map(n=>`<div class="row">${n}</div>`).join('')||'<div class="muted">pusto</div>'}
      ${d.alert?`<div class="alert"><span>${d.alert}</span><button id="x">×</button></div>`:''}
    </div>
    <div class="main">
      <p class="muted">Zaznacz mentalnie 3 pierwsze notatki i wykonaj operację. Przy drugim kroku „sukces” czyści trwały Alert.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="mv">Przenieś 3 do Archiwum (Gamma.md zawiedzie)</button>
        <button class="btn danger" id="del">Usuń 3 (Gamma.md zawiedzie)</button>
        <button class="btn" id="ok">Udane przeniesienie 1 notatki</button>
        <button class="btn" id="rs">Reset</button>
      </div>
      <p class="muted">Obserwuj sidebar: w wariancie A nie zostaje po komunikacie nic, w B komunikat stoi, aż coś się uda.</p>
      <div class="toasts" id="toasts"></div>
    </div>`;
    const take=()=>{const [a,b,c]=d.notes;return[a,b,c].filter(Boolean)};
    $('#mv').onclick=()=>{ const ok=d.notes.filter(n=>n!=='Gamma.md').slice(0,2); if(!d.notes.includes('Gamma.md')||!ok.length) return;
      d.notes=d.notes.filter(n=>!ok.includes(n)); d.dest.push(...ok);
      report('move','Przeniesiono 2 z 3. „Gamma.md” nie został przeniesiony (move-stopped).'); stage(); renderQuestion(); renderToasts(); };
    $('#del').onclick=()=>{ const ok=d.notes.filter(n=>n!=='Gamma.md').slice(0,2); if(!d.notes.includes('Gamma.md')||!ok.length) return;
      d.notes=d.notes.filter(n=>!ok.includes(n)); d.trash.push(...ok);
      report('del','Nie usunięto 1 notatki (delete-failed). Pozostałe usunięto.'); stage(); renderQuestion(); renderToasts(); };
    $('#ok').onclick=()=>{ const n=d.notes.find(x=>x!=='Gamma.md'); if(!n) return; d.notes=d.notes.filter(x=>x!==n); d.dest.push(n); d.alert=null; log('udana operacja – trwały Alert wyczyszczony'); stage(); renderQuestion(); };
    $('#rs').onclick=()=>{resetQ('q1');render();};
    if($('#x')) $('#x').onclick=()=>{d.alert=null;stage();};
  }
  if(q==='q3'){
    const d=S.q3;
    st.innerHTML=`<div class="side"><b>Notatki</b>
      ${d.notes.map(n=>`<div class="row">${n}<span class="act"><button data-n="${n}" class="rn">Zmień nazwę</button></span></div>`).join('')}
      <div class="muted">Najedź na notatkę i kliknij „Zmień nazwę”.</div></div>
    <div class="main">
      <p class="muted">Rename: wpisz <b>Inna.md</b> i zatwierdź, żeby wywołać kolizję.</p>
      <button class="btn" id="race">Kolizja bez dialogu (np. commit nagłówka / race)</button>
      <button class="btn" id="rs">Reset</button>
      <div class="toasts" id="toasts"></div>
      ${d.open?`<div class="modal-bg"><div class="modal">
        <b>Zmień nazwę</b>
        <div style="margin-top:8px"><input id="nm" class="${d.err?'bad':''}" value="${d.name}"></div>
        ${d.err?`<div class="field-err" role="alert">${d.err}</div>`:''}
        <div class="btns"><button class="btn" id="cn">Anuluj</button><button class="btn on" style="background:#3b6fd4" id="ok">Zmień nazwę</button></div>
      </div></div>`:''}
    </div>`;
    document.querySelectorAll('.rn').forEach(b=>b.onclick=()=>{d.open=true;d.name=b.dataset.n;d.err=null;stage();$('#nm').focus();$('#nm').select();});
    $('#race').onclick=()=>{ toast('„Inna.md” już istnieje. Nic nie zmieniono.'); };
    $('#rs').onclick=()=>{resetQ('q3');render();};
    if(d.open){
      $('#cn').onclick=()=>{d.open=false;stage();renderToasts();};
      $('#nm').oninput=e=>{d.name=e.target.value;};
      $('#nm').onkeydown=e=>{if(e.key==='Enter')$('#ok').click();};
      $('#ok').onclick=()=>{
        const typed=d.name;
        if(d.notes.includes(typed)&&typed!=='Testowa.md'){
          if(S.variant.q3==='A'){ d.err=`„${typed}” już istnieje w tym folderze.`; log('błąd inline, dialog otwarty'); stage(); const i=$('#nm'); i.focus(); }
          else { d.open=false; log('dialog zamknięty, nazwa „'+typed+'” utracona'); stage(); toast(`„${typed}” już istnieje. Nic nie zmieniono.`); }
        } else { d.open=false; d.notes=d.notes.map(n=>n==='Testowa.md'?typed:n); stage(); }
        renderQuestion();
      };
    }
  }
  if(q==='q6'){
    const d=S.q6;
    st.innerHTML=`<div class="side"><b>Notatki</b>
      <div class="row">Moja notatka.md</div><div class="row">Inna.md</div></div>
    <div class="main">
      ${d.alert?`<div class="alert" style="margin-bottom:10px"><span>${d.alert}</span><button id="x">×</button></div>`:''}
      <input class="t h1in" id="h1" value="${d.title}">
      <div class="muted" style="margin:4px 0 10px">Nazwa pliku: <b>${d.title==='Inna'?'Moja notatka':d.title}.md</b> (nagłówek zatwierdza się po opuszczeniu pola)</div>
      <textarea id="body" rows="6">${d.body}</textarea>
      <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="fill">Wpisz kolidujący tytuł „Inna”</button>
        <button class="btn" id="fix">Popraw tytuł na „Nowy tytuł”</button>
        <button class="btn" id="rs">Reset</button>
      </div>
      <div class="muted" id="hint" style="margin-top:6px"></div>
      <div class="toasts" id="toasts"></div>
    </div>`;
    const commit=()=>{
      const v=$('#h1').value; d.title=v;
      if(v==='Inna'){ const m='Nie można nazwać pliku „Inna.md”: taka notatka już istnieje. Plik zachował nazwę i tekst.';
        if(S.variant.q6==='A') toast(m); else { d.alert=m; log('alert nad edytorem'); }
        stage(); renderQuestion(); renderToasts();
      } else { d.title=v; stage(); }
    };
    $('#h1').onblur=commit;
    $('#h1').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#h1').blur();}};
    $('#body').oninput=e=>{d.body=e.target.value;};
    $('#fill').onclick=()=>{$('#h1').value='Inna';$('#h1').focus();$('#body').focus();};
    $('#fix').onclick=()=>{ $('#h1').value='Nowy tytuł'; d.title='Nowy tytuł'; log('tytuł poprawiony'+(d.alert?' – alert nadal wisi':'')); stage(); renderQuestion(); if(d.alert) $('#hint').innerHTML='<span class="stale">Tytuł jest już poprawny, a alert nadal wisi (trzeba zamknąć ręcznie).</span>'; };
    $('#rs').onclick=()=>{resetQ('q6');render();};
    if($('#x')) $('#x').onclick=()=>{d.alert=null;stage();};
  }
  renderToasts();
}

function render(){ renderQuestion(); stage(); }
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{S.q=t.dataset.q;render();});
render();
</script>
</body>
</html>
