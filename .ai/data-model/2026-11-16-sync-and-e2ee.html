<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Data model — 2026-11-16-sync-and-e2ee</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font:
          13px/1.4 ui-sans-serif,
          system-ui,
          sans-serif;
        background: #0f1115;
        color: #e6e8ee;
      }
      #toolbar {
        padding: 10px 14px;
        border-bottom: 1px solid #262a33;
        display: flex;
        gap: 18px;
        align-items: baseline;
      }
      #toolbar h1 {
        font-size: 14px;
        margin: 0;
        font-weight: 600;
      }
      #toolbar span {
        color: #9aa1ad;
      }
      #canvas {
        width: 100vw;
        height: calc(100vh - 44px);
        display: block;
        cursor: grab;
      }
      #canvas:active {
        cursor: grabbing;
      }
      .node rect {
        rx: 6px;
      }
      .node text {
        font-size: 12px;
        text-anchor: middle;
        dominant-baseline: middle;
        pointer-events: none;
      }
      .edge {
        stroke: #6b7280;
        stroke-width: 1.4;
      }
      .edge-label {
        fill: #9aa1ad;
        font-size: 10px;
        text-anchor: middle;
        pointer-events: none;
      }
      .dimmed {
        opacity: 0.12;
        transition: opacity 120ms;
      }
      .focused {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <h1>Sync and E2EE — data model</h1>
      <span
        >drag to pan · wheel to zoom · click a node to focus · click background
        to reset</span
      >
    </div>
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <g id="world"></g>
    </svg>
    <script id="graph-data" type="application/json">
      {
        "nodes": [
          {
            "id": "credentials",
            "label": "SyncCredentials\ndevice",
            "x": 150,
            "y": 90,
            "kind": "new"
          },
          {
            "id": "workspace",
            "label": "SyncWorkspace\nserver",
            "x": 150,
            "y": 250,
            "kind": "new"
          },
          {
            "id": "entry",
            "label": "SyncEntry\nserver",
            "x": 150,
            "y": 410,
            "kind": "new"
          },
          {
            "id": "version",
            "label": "EntryVersion\nserver",
            "x": 420,
            "y": 540,
            "kind": "new"
          },
          {
            "id": "blob",
            "label": "ContentBlob\nserver",
            "x": 700,
            "y": 540,
            "kind": "new"
          },
          {
            "id": "upload",
            "label": "PendingUpload\nserver",
            "x": 980,
            "y": 540,
            "kind": "new"
          },
          {
            "id": "index",
            "label": "SyncIndex\ndevice",
            "x": 700,
            "y": 90,
            "kind": "new"
          },
          {
            "id": "indexEntry",
            "label": "SyncIndexEntry\ndevice",
            "x": 700,
            "y": 250,
            "kind": "new"
          },
          {
            "id": "conflict",
            "label": "MergeConflict\ndevice, memory",
            "x": 700,
            "y": 410,
            "kind": "new"
          }
        ],
        "edges": [
          {
            "from": "credentials",
            "to": "workspace",
            "label": "1-1 workspaceId"
          },
          { "from": "workspace", "to": "entry", "label": "1-n" },
          { "from": "entry", "to": "version", "label": "1-n" },
          { "from": "version", "to": "blob", "label": "n-1" },
          { "from": "upload", "to": "blob", "label": "0-1 commits to" },
          { "from": "entry", "to": "indexEntry", "label": "1-n" },
          { "from": "index", "to": "indexEntry", "label": "1-n" },
          { "from": "credentials", "to": "index", "label": "1-1" },
          { "from": "indexEntry", "to": "conflict", "label": "0-n" }
        ]
      }
    </script>
    <script>
      (function () {
        "use strict";
        var NS = "http://www.w3.org/2000/svg";
        var data = JSON.parse(
          document.getElementById("graph-data").textContent,
        );
        var world = document.getElementById("world");
        var svg = document.getElementById("canvas");
        var nodeById = {};
        var neighbors = {};
        data.nodes.forEach(function (n) {
          neighbors[n.id] = {};
          nodeById[n.id] = n;
        });
        data.edges.forEach(function (e) {
          neighbors[e.from][e.to] = true;
          neighbors[e.to][e.from] = true;
        });

        function el(name, attrs) {
          var node = document.createElementNS(NS, name);
          Object.keys(attrs).forEach(function (k) {
            node.setAttribute(k, attrs[k]);
          });
          return node;
        }

        function multilineText(x, y, label, cls) {
          var text = el("text", { x: x, y: y, class: cls });
          var lines = String(label).split("\n");
          var offset = -((lines.length - 1) * 7);
          lines.forEach(function (line) {
            var tspan = el("tspan", {
              x: x,
              dy: offset === -((lines.length - 1) * 7) ? offset : 14,
            });
            tspan.textContent = line;
            text.appendChild(tspan);
          });
          return text;
        }

        var edgeLayer = el("g", {});
        var nodeLayer = el("g", {});
        world.appendChild(edgeLayer);
        world.appendChild(nodeLayer);

        data.edges.forEach(function (e) {
          var a = nodeById[e.from],
            b = nodeById[e.to];
          var line = el("line", {
            x1: a.x,
            y1: a.y,
            x2: b.x,
            y2: b.y,
            class: "edge",
          });
          var mx = (a.x + b.x) / 2,
            my = (a.y + b.y) / 2 - 6;
          var label = multilineText(mx, my, e.label, "edge-label");
          edgeLayer.appendChild(line);
          edgeLayer.appendChild(label);
          e.element = line;
          e.labelElement = label;
        });

        data.nodes.forEach(function (n) {
          var g = el("g", {
            class: "node",
            "data-id": n.id,
            tabindex: "0",
            role: "button",
            "aria-label": n.label.replace(/\n/g, " "),
          });
          var rect = el("rect", {
            x: n.x - 118,
            y: n.y - 30,
            width: 236,
            height: 60,
            rx: 6,
            fill: n.kind === "existing" ? "#e5e7eb" : "#2f6feb",
            stroke: n.kind === "existing" ? "#9ca3af" : "#1b4fb0",
          });
          var text = multilineText(n.x, n.y, n.label, "");
          text.setAttribute("fill", n.kind === "existing" ? "#111" : "#fff");
          g.appendChild(rect);
          g.appendChild(text);
          nodeLayer.appendChild(g);
          n.element = g;
          g.addEventListener("click", function (event) {
            event.stopPropagation();
            focus(n.id);
          });
          g.addEventListener("keydown", function (event) {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              focus(n.id);
            }
          });
        });

        var focusedId = null;
        function focus(id) {
          focusedId = id;
          data.nodes.forEach(function (n) {
            var visible = n.id === id || neighbors[id][n.id] === true;
            n.element.classList.toggle("dimmed", !visible);
            n.element.classList.toggle("focused", visible);
          });
          data.edges.forEach(function (e) {
            var visible = e.from === id || e.to === id;
            e.element.classList.toggle("dimmed", !visible);
            e.labelElement.classList.toggle("dimmed", !visible);
          });
        }
        function reset() {
          focusedId = null;
          data.nodes.forEach(function (n) {
            n.element.classList.remove("dimmed", "focused");
          });
          data.edges.forEach(function (e) {
            e.element.classList.remove("dimmed");
            e.labelElement.classList.remove("dimmed");
          });
        }

        var scale = 1,
          tx = 0,
          ty = 0,
          panning = false,
          start = null;
        function apply() {
          world.setAttribute(
            "transform",
            "translate(" + tx + " " + ty + ") scale(" + scale + ")",
          );
        }
        svg.addEventListener("pointerdown", function (event) {
          if (event.target.closest(".node")) return;
          panning = true;
          start = { x: event.clientX - tx, y: event.clientY - ty };
          svg.setPointerCapture(event.pointerId);
        });
        svg.addEventListener("pointermove", function (event) {
          if (!panning) return;
          tx = event.clientX - start.x;
          ty = event.clientY - start.y;
          apply();
        });
        svg.addEventListener("pointerup", function () {
          panning = false;
        });
        svg.addEventListener("click", function (event) {
          if (event.target === svg || event.target === world) reset();
        });
        svg.addEventListener(
          "wheel",
          function (event) {
            event.preventDefault();
            var next = Math.min(
              2.5,
              Math.max(0.4, scale * (event.deltaY < 0 ? 1.1 : 0.9)),
            );
            scale = next;
            apply();
          },
          { passive: false },
        );
        apply();
      })();
    </script>
  </body>
</html>
